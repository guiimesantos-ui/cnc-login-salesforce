<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .imagem-login {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 103%;
            height: 103%;

            transform: translate(-50%, -50%);

            object-fit: cover;
            object-position: center center;

            display: block;
        }
    </style>
</head>

<body>
    <img src="1.png" class="imagem-login" alt="">
</body>
</html>
