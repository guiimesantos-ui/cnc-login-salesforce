<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .imagem-login {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 110%;
            height: 110%;

            transform: translate(-50%, -50%);

            object-fit: cover;
            object-position: center center;

            display: block;
        }
.link-site {
    position: absolute;
    inset: 0;
    display: block;
    cursor: pointer;
}        
    </style>
</head>

<body>

    <a href="https://grupocnc.com.br/"
       target="_blank"
       rel="noopener noreferrer"
       class="link-site">

        <img src="1.png"
             class="imagem-login"
             alt="Grupo CNC">

    </a>

</body>
</html>
